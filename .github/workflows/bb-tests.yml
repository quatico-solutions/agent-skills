name: bb CLI tests

# Runs the working-with-bitbucket-api integration suite (node:test + Express mock
# server). Both jobs ALWAYS run and always report; each decides for itself whether there
# is anything worth testing and no-ops if not.
#
# That is deliberate. GitHub has no "not applicable" state for a required check: a
# path-filtered workflow that does not trigger produces no check run at all, so the
# requirement stays pending forever and unrelated PRs can never merge. The previous
# design worked around that with a second workflow reporting the same contexts as
# trivial successes, with mirrored `paths` / `paths-ignore` lists. Those lists are not
# complements — each asks "does ANY changed file match?" — so a PR touching files on
# both sides tripped both workflows and produced two runs per context, which on a mixed
# PR bought nothing: the real suite still had to pass. Release PRs hit it every time,
# since they always touch both skills/** and package.json.
#
# Filtering inside the job instead of on the trigger removes the whole class of problem.
# One run per context, no mirrored lists to drift, and no question about how GitHub
# resolves two check runs sharing a name.
#
# This is a PLATFORM matrix, not a bash-version sweep. `bb` supports two targets and
# each job is one of them:
#
#   bb-tests-linux   Linux + GNU userland
#   bb-tests-macos   macOS + BSD userland
#
# The bash version is incidental — it rides along because macOS ships bash 3.2 and
# always will (bash 4 went GPLv3, which Apple does not ship) while Linux runners ship
# bash 5. That difference is real and has bitten (see the macOS job below), but it is
# not the reason both jobs exist. `bb` shells out constantly to `column`, `sed`, `tr`,
# `od` and `date`, where the BSD and GNU implementations differ, and the skill's own
# SKILL.md declares Linux supported for everything except `bb auth login`. Dropping
# either job drops a documented platform.
#
# Do not collapse these into a bash matrix on one OS: that would test a combination
# nobody runs and stop testing two that people do.
#
# INVARIANT: job names are branch-protection check contexts, not labels. Renaming one
# requires updating the required-status-checks list on main in the same change, or every
# PR blocks forever on a context that no longer reports.
#
# INVARIANT: both jobs must run unconditionally. Do not add a job-level `if:` to skip
# them, and do not reintroduce a `paths:` filter — a skipped or absent job's standing as
# a required check is exactly the murky area this design exists to avoid. Gate the
# steps, not the job.
on:
  pull_request:
  push:
    branches: [main]

env:
  # Paths that make the suite worth running. The workflow itself is included so a change
  # to CI is exercised by CI. Defined once; both jobs read it.
  BB_PATH_RE: '^(skills/working-with-bitbucket-api/|\.github/workflows/bb-tests\.yml$)'

defaults:
  run:
    working-directory: skills/working-with-bitbucket-api/tests

jobs:
  # Linux + GNU userland. Also the faster of the two, so it is the one that usually
  # tells you a change is broken first.
  bb-tests-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Does this change touch the bb CLI?
        id: scope
        working-directory: .
        env:
          EVENT: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          # Post-merge runs on main always verify: there is no useful base to diff
          # against, and the cost is paid once per merge rather than once per push.
          if [ "$EVENT" != "pull_request" ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if git diff --name-only "$BASE_SHA" HEAD | grep -qE "$BB_PATH_RE"; then
            echo "bb CLI touched — running the integration suite."
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "No changes under skills/working-with-bitbucket-api — nothing to test."
            echo "run=false" >> "$GITHUB_OUTPUT"
          fi

      - uses: pnpm/action-setup@v4
        if: steps.scope.outputs.run == 'true'

      - uses: actions/setup-node@v4
        if: steps.scope.outputs.run == 'true'
        with:
          node-version: 20
          cache: pnpm
          cache-dependency-path: skills/working-with-bitbucket-api/tests/pnpm-lock.yaml

      # ubuntu-latest ships curl + jq, which `bb` shells out to. Assert they exist so a
      # missing tool fails loudly here rather than as a cryptic mid-test error.
      - name: Verify bb runtime deps
        if: steps.scope.outputs.run == 'true'
        run: curl --version && jq --version

      - name: Install test deps
        if: steps.scope.outputs.run == 'true'
        run: pnpm install --frozen-lockfile

      - name: Run bb integration suite
        if: steps.scope.outputs.run == 'true'
        run: pnpm test

  # macOS + BSD userland — the platform `bb` is primarily written for (`bb auth login`
  # uses the macOS Keychain via `security`, and `open`).
  #
  # It pins /bin/bash, so it also covers the bash 3.2 floor. That is a side effect of
  # the platform, not the point of the job, but it is the side effect that has actually
  # caught bugs: `${2^^}` and an empty-array expansion under `set -u` both reached main
  # via the Linux job, silently breaking --state, --method, --data, --remove-reviewer
  # and --jq for anyone without Homebrew bash ahead of /bin/bash.
  #
  # A static grep for known bash-4 syntax would be a blocklist and would have missed the
  # empty-array case, which is a runtime behaviour difference rather than a syntax error.
  # Running the real suite against the real old shell is the only honest check.
  bb-tests-macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Does this change touch the bb CLI?
        id: scope
        working-directory: .
        env:
          EVENT: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          if [ "$EVENT" != "pull_request" ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if git diff --name-only "$BASE_SHA" HEAD | grep -qE "$BB_PATH_RE"; then
            echo "bb CLI touched — running the integration suite."
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "No changes under skills/working-with-bitbucket-api — nothing to test."
            echo "run=false" >> "$GITHUB_OUTPUT"
          fi

      - uses: pnpm/action-setup@v4
        if: steps.scope.outputs.run == 'true'

      - uses: actions/setup-node@v4
        if: steps.scope.outputs.run == 'true'
        with:
          node-version: 20
          cache: pnpm
          cache-dependency-path: skills/working-with-bitbucket-api/tests/pnpm-lock.yaml

      # Put macOS's own bash 3.2 ahead of anything the runner image preinstalls, so
      # `#!/usr/bin/env bash` in bin/bb resolves to it.
      - name: Pin bash to the macOS system shell
        if: steps.scope.outputs.run == 'true'
        run: |
          mkdir -p "$RUNNER_TEMP/bash32"
          ln -sf /bin/bash "$RUNNER_TEMP/bash32/bash"
          echo "$RUNNER_TEMP/bash32" >> "$GITHUB_PATH"

      # Without this the job would keep passing if the image ever changed and the shim
      # stopped resolving — a green check that tests nothing is worse than no check.
      - name: Assert the suite will run against bash 3.2
        if: steps.scope.outputs.run == 'true'
        run: |
          version="$(bash --version | head -1)"
          echo "$version"
          case "$version" in
            *"version 3.2"*) ;;
            *) echo "::error::expected bash 3.2, got: $version"; exit 1 ;;
          esac

      - name: Verify bb runtime deps
        if: steps.scope.outputs.run == 'true'
        run: |
          command -v jq >/dev/null || brew install jq
          curl --version && jq --version

      - name: Install test deps
        if: steps.scope.outputs.run == 'true'
        run: pnpm install --frozen-lockfile

      - name: Run bb integration suite
        if: steps.scope.outputs.run == 'true'
        run: pnpm test
