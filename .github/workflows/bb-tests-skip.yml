name: bb CLI tests (skip)

# Companion to bb-tests.yml. `bb-tests` is a REQUIRED status check on main, but
# bb-tests.yml is path-filtered to the skill that owns the `bb` CLI. GitHub has
# no notion of "not applicable" for a required check: a workflow that does not
# trigger produces no check run, so the requirement stays pending forever and
# PRs touching anything else can never merge without an admin override.
#
# This workflow reports the same `bb-tests` context as a trivial success on the
# PRs where the real suite deliberately does not run. Non-bb PRs go green; bb
# PRs still run the real integration suite in bb-tests.yml.
#
# INVARIANT: `paths-ignore` below must mirror `paths` in bb-tests.yml. If the
# lists drift so that some path matches neither, PRs touching only that path are
# blocked again on a check that never runs. Change both together.
#
# CAVEAT — the two filters are NOT mutually exclusive. `paths` and `paths-ignore`
# each ask "does ANY changed file match?", so a PR touching files on both sides
# (e.g. bb-tests.yml AND an unrelated file) triggers BOTH workflows and produces
# two `bb-tests` check runs. Observed on PR #40. Both must then pass for the
# required check to be green, so a mixed PR is gated by the real suite — the safe
# direction. Do not assume exactly one run.
on:
  pull_request:
    paths-ignore:
      - 'skills/working-with-bitbucket-api/**'
      - '.github/workflows/bb-tests.yml'
      - '.github/workflows/bb-tests-skip.yml'

jobs:
  # Job names MUST stay `bb-tests` / `bb-bash32` — they are check contexts, not labels.
  # Every job in bb-tests.yml needs a stub here, or making it required would block every
  # non-bb PR on a check that never runs.
  bb-tests:
    runs-on: ubuntu-latest
    steps:
      - name: No bb CLI changes
        run: echo "No changes under skills/working-with-bitbucket-api — skipping the bb integration suite."

  bb-bash32:
    runs-on: ubuntu-latest
    steps:
      - name: No bb CLI changes
        run: echo "No changes under skills/working-with-bitbucket-api — skipping the bash 3.2 run."
