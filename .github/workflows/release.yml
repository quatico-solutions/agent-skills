name: Release

on:
  push:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write
  pull-requests: write

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      # GitHub runs workflows on a PR opened by github-actions[bot] only after a
      # maintainer approves them (changelog 2026-06-11). A release PR opened by
      # the release App runs its checks without that step. Without the App's
      # secrets, the job falls back to GITHUB_TOKEN and the approval returns.
      HAS_RELEASE_APP: ${{ secrets.RELEASE_APP_ID != '' }}
    steps:
      - name: Mint release App token
        id: app-token
        if: env.HAS_RELEASE_APP == 'true'
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ secrets.RELEASE_APP_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}

      # The token goes to checkout too: checkout stores its credentials for
      # later pushes, and the release branch must be pushed as the App.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ steps.app-token.outputs.token || secrets.GITHUB_TOKEN }}

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Compute next release version
        id: nextver
        run: |
          # Predict the next package version from pending changesets so the
          # release PR title and commit message can include the actual version
          # (e.g. "release: 2.3.0") instead of a generic "chore: release".
          npx changeset status --output=/tmp/changeset-status.json \
            || echo '{"releases":[]}' > /tmp/changeset-status.json
          NEXT=$(jq -r '.releases[] | select(.name=="@quatico-solutions/agent-skills") | .newVersion' \
            /tmp/changeset-status.json | head -n1)
          NEXT="${NEXT:-pending}"
          echo "version=$NEXT" >> "$GITHUB_OUTPUT"
          echo "Next version: $NEXT"

      - name: Create Release PR or Publish
        id: changesets
        uses: changesets/action@v1
        with:
          version: pnpm run version
          publish: bash .dev/scripts/create-release.sh
          commit: "release: ${{ steps.nextver.outputs.version }}"
          title: "release: ${{ steps.nextver.outputs.version }}"
        env:
          GITHUB_TOKEN: ${{ steps.app-token.outputs.token || secrets.GITHUB_TOKEN }}
          TAP_DEPLOY_KEY: ${{ secrets.TAP_DEPLOY_KEY }}

      - name: Assign release PR
        if: steps.changesets.outputs.pullRequestNumber
        env:
          PR_NUMBER: ${{ steps.changesets.outputs.pullRequestNumber }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh pr edit "$PR_NUMBER" --add-assignee eins78
